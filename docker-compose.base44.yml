services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      # Bind-mount the source for live editing
      - ./:/app
      # Preserve node_modules from the Docker build (don't let bind mount overwrite it)
      - node_modules:/app/node_modules
    ports:
      - "3000:5000"
    environment:
      # Settings API server port (server.js) — rsbuild dev proxies /api here
      - SETTINGS_PORT=3001
      - NODE_ENV=development
      # Bind-mount file watching needs polling
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "node server.js & npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped

volumes:
  node_modules:
